
name: Flashscore Collector - Automatic

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: flashscore-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: python -m compileall -q .

      - name: Collect football odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import time
          import subprocess
          import urllib.request
          import urllib.error
          from urllib.parse import urlencode
          from datetime import datetime, timezone, timedelta

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_SECRET_KEY"]

          API = "http://127.0.0.1:8000"
          MAX_MATCHES_PER_RUN = 20

          if not BASE or not KEY:
              raise RuntimeError("Supabase secrets are missing")

          def now():
              return datetime.now(timezone.utc)

          def parse_date(value):
              if not value:
                  return None
              try:
                  result = datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
                  if result.tzinfo is None:
                      result = result.replace(tzinfo=timezone.utc)
                  return result
              except (ValueError, TypeError):
                  return None

          def db(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  BASE + "/rest/v1/" + path,
                  data=data,
                  method=method,
                  headers={
                      "apikey": KEY,
                      "Authorization": "Bearer " + KEY,
                      "Content-Type": "application/json",
                      "Prefer": "resolution=merge-duplicates,return=representation"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body) if body else []
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  raise RuntimeError(
                      f"Supabase HTTP {error.code}: {detail[:1000]}"
                  )

          def get_interval(start_time, status):
              text = str(status or "").lower()

              finished_words = [
                  "finished", "ended", "ft", "cancelled",
                  "postponed", "abandoned"
              ]

              if any(word in text for word in finished_words):
                  return None

              live_words = [
                  "live", "in progress", "inprogress",
                  "halftime", "half time"
              ]

              if any(word in text for word in live_words):
                  return 5

              start = parse_date(start_time)

              if not start:
                  return 60

              minutes = (start - now()).total_seconds() / 60

              if minutes <= 0:
                  return 5
              if minutes <= 180:
                  return 5
              if minutes <= 360:
                  return 10
              if minutes <= 720:
                  return 15
              if minutes <= 1440:
                  return 30

              return 60

          def get_last_jobs():
              rows = db(
                  "GET",
                  "collection_jobs?select=match_id,stage,executed_at,"
                  "scheduled_at,status,attempts,created_at"
                  "&order=created_at.desc&limit=5000"
              )

              latest = {}

              for row in rows:
                  match_id = row.get("match_id")

                  if match_id and match_id not in latest:
                      latest[match_id] = row

              return latest

          def is_due(start_time, status, last_job):
              interval = get_interval(start_time, status)

              if interval is None:
                  return False

              if not last_job:
                  return True

              last_time = (
                  parse_date(last_job.get("executed_at"))
                  or parse_date(last_job.get("created_at"))
              )

              if not last_time:
                  return True

              elapsed = (
                  now() - last_time
              ).total_seconds() / 60

              if last_job.get("status") == "failed":
                  return elapsed >= 15

              return elapsed >= interval

          def get_latest_odds(
              match_id,
              bookmaker_id,
              market_id,
              selection,
              line_value,
              stage
          ):
              params = {
                  "select": "odds,is_suspended,captured_at",
                  "match_id": "eq." + str(match_id),
                  "bookmaker_id": "eq." + str(bookmaker_id),
                  "market_id": "eq." + str(market_id),
                  "selection": "eq." + str(selection),
                  "snapshot_stage": "eq." + stage,
                  "order": "captured_at.desc",
                  "limit": "1"
              }

              if line_value is None:
                  params["line_value"] = "is.null"
              else:
                  params["line_value"] = "eq." + str(line_value)

              rows = db(
                  "GET",
                  "odds_history?" + urlencode(params)
              )

              return rows[0] if rows else None

          def save_odds(match_db_id, markets):
              saved = 0
              unchanged = 0

              for market in markets:
                  bookmaker = market.get("bookmaker") or {}

                  bookmaker_external_id = str(
                      bookmaker.get("id") or ""
                  )

                  if not bookmaker_external_id:
                      continue

                  bookmaker_rows = db(
                      "POST",
                      "bookmakers?on_conflict=source,external_bookmaker_id",
                      {
                          "source": "flashscore",
                          "external_bookmaker_id": bookmaker_external_id,
                          "name": bookmaker.get(
                              "name", bookmaker_external_id
                          )
                      }
                  )

                  if not bookmaker_rows:
                      raise RuntimeError("Bookmaker save failed")

                  bookmaker_db_id = bookmaker_rows[0]["id"]

                  bet_type = market.get(
                      "bet_type", "unknown"
                  )
                  bet_scope = market.get(
                      "bet_scope", "full-time"
                  )

                  market_key = bet_type + ":" + bet_scope

                  market_rows = db(
                      "POST",
                      "odds_markets?on_conflict=market_key",
                      {
                          "market_key": market_key,
                          "market_name": bet_type,
                          "category": "1X2",
                          "period": bet_scope
                      }
                  )

                  if not market_rows:
                      raise RuntimeError("Market save failed")

                  market_db_id = market_rows[0]["id"]

                  for selection in market.get("selections", []):
                      try:
                          value = float(selection.get("value"))
                      except (TypeError, ValueError):
                          continue

                      if value <= 1:
                          continue

                      selection_name = str(
                          selection.get("selection", "unknown")
                      )

                      line_value = selection.get("handicap")

                      suspended = not selection.get(
                          "is_active", True
                      )

                      common = {
                          "match_id": match_db_id,
                          "bookmaker_id": bookmaker_db_id,
                          "market_id": market_db_id,
                          "selection": selection_name,
                          "line_value": line_value,
                          "is_suspended": suspended,
                          "source": "flashscore"
                      }

                      # Açılış oranı: yalnızca ilk kez kaydet.
                      opening = selection.get("opening_value")

                      try:
                          opening = (
                              float(opening)
                              if opening is not None
                              else None
                          )
                      except (TypeError, ValueError):
                          opening = None

                      if opening is not None and opening > 1:
                          old_opening = get_latest_odds(
                              match_db_id,
                              bookmaker_db_id,
                              market_db_id,
                              selection_name,
                              line_value,
                              "opening"
                          )

                          if old_opening is None:
                              db(
                                  "POST",
                                  "odds_history",
                                  {
                                      **common,
                                      "odds": opening,
                                      "snapshot_stage": "opening"
                                  }
                              )
                              saved += 1

                      # Güncel oran: yalnızca değişirse kaydet.
                      previous = get_latest_odds(
                          match_db_id,
                          bookmaker_db_id,
                          market_db_id,
                          selection_name,
                          line_value,
                          "current"
                      )

                      changed = (
                          previous is None
                          or abs(
                              float(previous["odds"]) - value
                          ) > 0.00001
                          or bool(
                              previous.get("is_suspended")
                          ) != suspended
                      )

                      if changed:
                          db(
                              "POST",
                              "odds_history",
                              {
                                  **common,
                                  "odds": value,
                                  "snapshot_stage": "current"
                              }
                          )
                          saved += 1
                      else:
                          unchanged += 1

              return saved, unchanged

          server = subprocess.Popen(
              [sys.executable, "run.py"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.STDOUT
          )

          successful = 0
          failed = 0
          total_saved = 0

          try:
              # API başlatma kontrolü.
              for attempt in range(45):
                  try:
                      urllib.request.urlopen(
                          API + "/health",
                          timeout=3
                      )
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError(
                      "Flashscore API did not start"
                  )

              print("Flashscore API started")

              # Maçları getir.
              with urllib.request.urlopen(
                  API + "/matches?sport=football",
                  timeout=90
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              competitions = data.get("competitions", [])

              all_matches = []

              for competition in competitions:
                  for item in competition.get("matches", []):
                      if item.get("id"):
                          item["_competition"] = competition
                          all_matches.append(item)

              print("Total matches:", len(all_matches))

              # Supabase bağlantı ve geçmiş iş kontrolü.
              db("GET", "matches?select=id&limit=1")

              last_jobs = get_last_jobs()

              due_matches = []

              for item in all_matches:
                  status = item.get("status", "scheduled")
                  start_time = item.get("start_time")

                  if get_interval(start_time, status) is None:
                      continue

                  external_id = str(item["id"])

                  existing = db(
                      "GET",
                      "matches?select=id&source=eq.flashscore"
                      "&external_match_id=eq."
                      + external_id + "&limit=1"
                  )

                  match_db_id = (
                      existing[0]["id"] if existing else None
                  )

                  last_job = (
                      last_jobs.get(match_db_id)
                      if match_db_id else None
                  )

                  if is_due(start_time, status, last_job):
                      due_matches.append(
                          (item, match_db_id, last_job)
                      )

              # Önce en uzun süredir taranmayan maçlar.
              def sort_key(entry):
                  item, match_db_id, last_job = entry

                  previous = None

                  if last_job:
                      previous = (
                          parse_date(last_job.get("executed_at"))
                          or parse_date(
                              last_job.get("created_at")
                          )
                      )

                  return (
                      previous
                      or datetime(
                          2000, 1, 1, tzinfo=timezone.utc
                      )
                  )

              due_matches.sort(key=sort_key)

              selected_matches = due_matches[
                  :MAX_MATCHES_PER_RUN
              ]

              print("Due matches:", len(due_matches))
              print(
                  "Selected this run:",
                  len(selected_matches)
              )

              for item, match_db_id, last_job in selected_matches:
                  external_id = str(item["id"])

                  competition = item.get(
                      "_competition", {}
                  )

                  home = item.get(
                      "home", {}
                  ).get("name", "Unknown")

                  away = item.get(
                      "away", {}
                  ).get("name", "Unknown")

                  status = item.get(
                      "status", "scheduled"
                  )

                  start_time = item.get("start_time")

                  if not start_time:
                      print(
                          "SKIP missing start time:",
                          home, "-", away
                      )
                      continue

                  job_id = None

                  try:
                      # Önce maçı kaydet.
                      match_payload = {
                          "source": "flashscore",
                          "external_match_id": external_id,
                          "home_team": home,
                          "away_team": away,
                          "league": competition.get("name"),
                          "country": competition.get("country"),
                          "start_time": start_time,
                          "status": str(status)
                      }

                      match_rows = db(
                          "POST",
                          "matches?on_conflict=source,external_match_id",
                          match_payload
                      )

                      if not match_rows:
                          raise RuntimeError(
                              "Match save failed"
                          )

                      match_db_id = match_rows[0]["id"]

                      # Maç kaydedildikten sonra iş oluştur.
                      parsed_start = parse_date(start_time)

                      stage = (
                          "live"
                          if parsed_start and parsed_start <= now()
                          else "pre_match"
                      )

                      attempts = 1

                      if last_job:
                          attempts = (
                              int(last_job.get("attempts") or 0) + 1
                          )

                      job_rows = db(
                          "POST",
                          "collection_jobs",
                          {
                              "match_id": match_db_id,
                              "stage": stage,
                              "scheduled_at": now().isoformat(),
                              "status": "running",
                              "attempts": attempts
                          }
                      )

                      job_id = (
                          job_rows[0]["id"]
                          if job_rows else None
                      )

                      # Doğrulanmış 1X2 marketi.
                      params = urlencode({
                          "match": external_id,
                          "bet_type": "home-draw-away",
                          "bet_scope": "full-time",
                          "geo": "TR"
                      })

                      with urllib.request.urlopen(
                          API + "/matches/odds?" + params,
                          timeout=90
                      ) as response:
                          odds_data = json.loads(
                              response.read().decode("utf-8")
                          )

                      if odds_data.get("error"):
                          raise RuntimeError(
                              str(odds_data["error"])
                          )

                      markets = odds_data.get("markets", [])

                      if not markets:
                          raise RuntimeError(
                              "No odds markets returned"
                          )

                      saved, unchanged = save_odds(
                          match_db_id,
                          markets
                      )

                      total_saved += saved
                      successful += 1

                      prin
