
name: Flashscore Collector - Supabase Data Test

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: python -m compileall -q .

      - name: Collect and save test odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import time
          import subprocess
          import urllib.request
          import urllib.error
          from urllib.parse import urlencode

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]

          if not base or not key:
              raise RuntimeError("Supabase secrets are missing")

          def db(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  base + "/rest/v1/" + path,
                  data=data,
                  method=method,
                  headers={
                      "apikey": key,
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "Prefer": "resolution=merge-duplicates,return=representation"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  return json.loads(body) if body else []

          server = subprocess.Popen(
              [sys.executable, "run.py"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.STDOUT
          )

          try:
              # Flashscore API başlat
              for attempt in range(30):
                  try:
                      urllib.request.urlopen(
                          "http://127.0.0.1:8000/health",
                          timeout=3
                      )
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError("Flashscore API did not start")

              print("Flashscore API started!")

              # Maçları çek
              matches_url = "http://127.0.0.1:8000/matches?sport=football"

              with urllib.request.urlopen(matches_url, timeout=90) as response:
                  matches_data = json.loads(
                      response.read().decode("utf-8")
                  )

              competitions = matches_data.get("competitions", [])
              print("Match count:", matches_data.get("match_count", 0))
              print("Competition count:", len(competitions))

              selected = None
              selected_competition = {}

              for competition in competitions:
                  for item in competition.get("matches", []):
                      if item.get("id"):
                          selected = item
                          selected_competition = competition
                          break
                  if selected:
                      break

              if not selected:
                  raise RuntimeError("No match ID found")

              match_id = str(selected["id"])
              home = selected.get("home", {}).get("name", "Unknown")
              away = selected.get("away", {}).get("name", "Unknown")

              print("Selected match:", home, "-", away)
              print("Flashscore match ID:", match_id)

              # Oranları çek
              params = urlencode({
                  "match": match_id,
                  "bet_type": "home-draw-away",
                  "bet_scope": "full-time",
                  "geo": "TR"
              })

              odds_url = (
                  "http://127.0.0.1:8000/matches/odds?" + params
              )

              with urllib.request.urlopen(odds_url, timeout=90) as response:
                  odds_data = json.loads(
                      response.read().decode("utf-8")
                  )
                  print("Odds HTTP status:", response.status)

              if odds_data.get("error"):
                  raise RuntimeError(str(odds_data["error"]))

              markets = odds_data.get("markets", [])

              if not markets:
                  raise RuntimeError("No odds markets returned")

              print("Odds market count:", len(markets))

              # Supabase bağlantısını kontrol et
              db("GET", "matches?select=id&limit=1")
              print("Supabase connection successful!")

              # Maç başlangıç zamanı
              start = (
                  selected.get("start_time")
                  or odds_data.get("start_time")
              )

              if not start:
                  raise RuntimeError("Match start time is missing")

              # Maçı kaydet veya güncelle
              match_rows = db(
                  "POST",
                  "matches?on_conflict=source,external_match_id",
                  {
                      "source": "flashscore",
                      "external_match_id": match_id,
                      "home_team": home,
                      "away_team": away,
                      "league": selected_competition.get("name"),
                      "country": selected_competition.get("country"),
                      "start_time": start,
                      "status": odds_data.get("status", "scheduled")
                  }
              )

              if not match_rows:
                  raise RuntimeError("Match database record not returned")

              match_db_id = match_rows[0]["id"]
              print("Match saved:", match_db_id)

              saved = 0

              # Bahis şirketlerini, marketleri ve oranları kaydet
              for market in markets:
                  bookmaker = market.get("bookmaker", {})
                  bookmaker_external_id = str(bookmaker.get("id", ""))

                  if not bookmaker_external_id:
                      continue

                  bookmaker_rows = db(
                      "POST",
                      "bookmakers?on_conflict=source,external_bookmaker_id",
                      {
                          "source": "flashscore",
                          "external_bookmaker_id": bookmaker_external_id,
                          "name": bookmaker.get(
                              "name",
                              bookmaker_external_id
                          )
                      }
                  )

                  if not bookmaker_rows:
                      raise RuntimeError("Bookmaker record not returned")

                  bookmaker_db_id = bookmaker_rows[0]["id"]

                  bet_type = market.get("bet_type", "unknown")
                  bet_scope = market.get("bet_scope", "full-time")
                  market_key = bet_type + ":" + bet_scope

                  market_rows = db(
                      "POST",
                      "odds_markets?on_conflict=market_key",
                      {
                          "market_key": market_key,
                          "market_name": bet_type,
                          "category": "1X2",
                          "period": bet_scope
                      }
                  )

                  if not market_rows:
                      raise RuntimeError("Market record not returned")

                  market_db_id = market_rows[0]["id"]

                  for selection in market.get("selections", []):
                      value = selection.get("value")

                      if value is None or float(value) <= 1:
                          continue

                      common = {
                          "match_id": match_db_id,
                          "bookmaker_id": bookmaker_db_id,
                          "market_id": market_db_id,
                          "selection": str(
                              selection.get("selection", "unknown")
                          ),
                          "line_value": selection.get("handicap"),
                          "is_suspended": not selection.get(
                              "is_active", True
                          ),
                          "source": "flashscore"
                      }

                      # Güncel oran
                      db(
                          "POST",
                          "odds_history",
                          {
                              **common,
                              "odds": float(value),
                              "snapshot_stage": "test"
                          }
                      )
                      saved += 1

                      # Açılış oranı
                      opening = selection.get("opening_value")

                      if opening is not None and float(opening) > 1:
                          db(
                              "POST",
                              "odds_history",
                              {
                                  **common,
                                  "odds": float(opening),
                                  "snapshot_stage": "opening"
                              }
                          )
                          saved += 1

              if saved == 0:
                  raise RuntimeError("No odds records were saved")

              print("MATCH SAVED:", home, "-", away)
              print("ODDS RECORDS SAVED:", saved)
              print("SUPABASE ODDS SAVE SUCCESSFUL!")

          finally:
              server.terminate()
              server.wait(timeout=10)
          PY
          
