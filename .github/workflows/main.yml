
name: Flashscore Collector - Data Test

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: python -m compileall -q .

      - name: Test Flashscore match collection
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import time
          import json
          import urllib.request

          server = subprocess.Popen(
              [sys.executable, "run.py"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.STDOUT
          )

          try:
              for attempt in range(30):
                  try:
                      urllib.request.urlopen(
                          "http://127.0.0.1:8000/health",
                          timeout=3
                      )
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError("Flashscore API did not start")

              print("Flashscore API started!")

              url = "http://127.0.0.1:8000/matches?sport=football"
              request = urllib.request.Request(url)

              with urllib.request.urlopen(request, timeout=90) as response:
                  data = json.loads(response.read().decode("utf-8"))

              if data.get("error"):
                  raise RuntimeError(data["error"])

              print("Flashscore HTTP status: 200")
              print("Response keys:", list(data.keys()))

              competitions = data.get("competitions", [])
              match_count = data.get("match_count", 0)

              print("Match count:", match_count)
              print("Competition count:", data.get("competition_count", 0))

              shown = 0
              for competition in competitions:
                  for match in competition.get("matches", []):
                      home = match.get("home", {}).get("name", "?")
                      away = match.get("away", {}).get("name", "?")
                      print("MATCH:", home, "-", away)
                      shown += 1
                      if shown >= 5:
                          break
                  if shown >= 5:
                      break

              if not competitions:
                  raise RuntimeError("No football competitions returned")

              print("Flashscore match test successful!")

          finally:
              server.terminate()
              server.wait(timeout=10)
          PY

      - name: Test Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]

          request = urllib.request.Request(
              url + "/rest/v1/matches?select=id&limit=1",
              headers={"apikey": key}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("Supabase HTTP status:", response.status)

          print("Supabase connection successful!")
          PY

      - name: Test completed
        run: echo "Flashscore and Supabase tests successful!"

        
      - name: Test Flashscore odds
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import time
          import json
          import urllib.request
          from urllib.parse import urlencode

          server = subprocess.Popen(
              [sys.executable, "run.py"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.STDOUT
          )

          try:
              for attempt in range(30):
                  try:
                      urllib.request.urlopen(
                          "http://127.0.0.1:8000/health",
                          timeout=3
                      )
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError("API did not start")

              url = "http://127.0.0.1:8000/matches?sport=football"
              with urllib.request.urlopen(url, timeout=90) as response:
                  matches_data = json.loads(response.read().decode("utf-8"))

              all_matches = []
              for competition in matches_data.get("competitions", []):
                  all_matches.extend(competition.get("matches", []))

              match = next(
                  (item for item in all_matches if item.get("id")),
                  None
              )

              if not match:
                  raise RuntimeError("No match ID found")

              print("Selected match:", match["id"])
              print(
                  match.get("home", {}).get("name", "?"),
                  "-",
                  match.get("away", {}).get("name", "?")
              )

              params = urlencode({
                  "match": match["id"],
                  "bet_type": "home-draw-away",
                  "bet_scope": "full-time",
                  "geo": "TR"
              })

              odds_url = "http://127.0.0.1:8000/matches/odds?" + params

              try:
                  with urllib.request.urlopen(odds_url, timeout=90) as response:
                      odds_data = json.loads(
                          response.read().decode("utf-8")
                      )
                      print("Odds HTTP status:", response.status)
              except urllib.error.HTTPError as error:
                  print("Odds HTTP error:", error.code)
                  print(error.read().decode("utf-8")[:3000])
                  raise

              print("Odds response keys:", list(odds_data.keys()))
              print("ODDS DATA:")
              print(json.dumps(odds_data, ensure_ascii=False)[:5000])

              if odds_data.get("error"):
                  raise RuntimeError(str(odds_data["error"]))

              print("Flashscore odds test completed!")

          finally:
              server.terminate()
              server.wait(timeout=10)
          PY
          
        
