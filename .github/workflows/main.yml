
name: Flashscore Collector - Supabase Test

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: python -m compileall -q .

      - name: Test Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]

          if not url or not key:
              raise RuntimeError("Supabase secrets are missing")

          request = urllib.request.Request(
              url + "/rest/v1/matches?select=id&limit=1",
              headers={"apikey": key},
              method="GET"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("Supabase HTTP status:", response.status)
                  if response.status != 200:
                      raise RuntimeError("Supabase connection failed")
          except Exception as error:
              print("Supabase connection error:", type(error).__name__)
              raise

          print("Supabase connection successful!")
          PY

      - name: Test completed
        run: echo "Python and Supabase tests successful!"
